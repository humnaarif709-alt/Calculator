<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #f2f2f2;
    font-family: Arial, sans-serif;
}

.calculator {
    width: 320px;
    padding: 20px;
    background: #222;
    border-radius: 15px;
}

#display {
    width: 100%;
    height: 70px;
    margin-bottom: 15px;
    font-size: 30px;
    text-align: right;
    padding: 10px;
    border: none;
    border-radius: 8px;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;

}

button {
    height: 60px;
    font-size: 22px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

.c-btn{
background: #FFC300;
  color: white;
}

.del-btn{
background: #ff3b3b;
  color: white;
}

.equal-btn{
background: #FFB700 ;
  color: white;
}

button:hover {
    opacity: 0.8;
}

.zero {
    grid-column: span 2;
}
    </style>

</head>
<body>
 <div class="calculator">
    
    <!-- Upar wala screen jahan number dikhenge -->
    <input type="text" id="display" placeholder="0">

    <!-- Buttons ki line -->
    <div class="buttons">
      <button class="c-btn">C</button>
      <button class="del-btn">DEL</button>
      <button>%</button>
      <button>/</button>

      <button>7</button>
      <button>8</button>
      <button>9</button>
      <button>*</button>

      <button>4</button>
      <button>5</button>
      <button>6</button>
      <button>-</button>

      <button>1</button>
      <button>2</button>
      <button>3</button>
      <button>+</button>

      <button class="zero">0</button>
      <button>.</button>
      <button class="equal-btn">=</button>
    </div>
  </div>

<script>
 let display = document.getElementById("display");
  let buttons = document.querySelectorAll("button");

  buttons.forEach(btn => {
    btn.addEventListener("click", () => {
      let value = btn.innerText;
      if (value == "C") display.value = "";
      else if (value == "DEL") display.value = display.value.slice(0, -1);
      else if (value == "=") display.value = eval(display.value);
      else display.value += value;
    });
  });
</script>
</body>
</html>
</html>
